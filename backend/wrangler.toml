# queue = "deynold-danny-emails"
# max_batch_size = 10
# max_batch_timeout = 30

# Secrets to be configured via `wrangler secret put <KEY> --env <staging|production>`:
# - JWT_SECRET
# - JWT_SECRET_PREV               (optional previous secret during key rotation)
# - RESEND_API_KEY
# - RESEND_FROM_EMAIL             (verified Resend sender e.g. "DEYNOLD DANNY <concierge@deynolddanny.com>")
# - RAZORPAY_KEY_ID
# - RAZORPAY_KEY_SECRET
# - RAZORPAY_WEBHOOK_SECRET
# - SHIPROCKET_EMAIL
# - SHIPROCKET_PASSWORD
# - SHIPROCKET_WEBHOOK_TOKEN      (shared x-api-key header configured in Shiprocket webhook settings)
# - ADMIN_EMAILS
# - CLOUDFLARE_ACCESS_AUD         (optional Cloudflare Access AUD tag for zero-trust admin defense-in-depth)
# - CLOUDFLARE_ACCESS_TEAM_DOMAIN (optional e.g. https://deynolddanny.cloudflareaccess.com)
# - PAYMENT_UPI_MAX_PAISE         (optional UPI ceiling once confirmed by provider, e.g. 10000000)
# - PAN_VERIFICATION_THRESHOLD_PAISE (optional statutory PAN threshold once CA confirms, e.g. 20000000)
# - EWAY_BILL_THRESHOLD_PAISE     (optional statutory E-Way threshold once CA confirms, e.g. 5000000)
# - INVOICE_RETENTION_YEARS       (optional statutory archival retention years once CA confirms)
# - CASHFREE_APP_ID               (optional legacy fallback)
# - CASHFREE_SECRET_KEY           (optional legacy fallback)
